openapi: 3.0.3

info:
  title: Redira API
  description: |
    Redira is a production-ready URL shortening platform.

    The API supports:
    - User authentication
    - URL creation
    - Link management
    - Redirect handling
    - Analytics
    - Dashboard metrics

  version: 1.0.0


servers:

  - url: http://localhost:8080/api/v1
    description: Local development server


tags:

  - name: Authentication
  - name: Links
  - name: Analytics
  - name: Health


paths:

  /auth/register:

    post:

      tags:
        - Authentication

      summary: Register a new user

      requestBody:

        required: true

        content:

          application/json:

            schema:

              type: object

              properties:

                email:
                  type: string

                password:
                  type: string


      responses:

        "201":

          description: User created


  /auth/login:

    post:

      tags:
        - Authentication

      summary: Login user


      responses:

        "200":

          description: Authentication successful



  /links:

    post:

      tags:
        - Links

      summary: Create short link


      security:

        - bearerAuth: []


      responses:

        "201":

          description: Link created



    get:

      tags:

        - Links


      summary: Get user links


      security:

        - bearerAuth: []


      responses:

        "200":

          description: List of links



  /analytics/{id}:

    get:

      tags:

        - Analytics


      summary: Get link analytics


      parameters:

        - name: id

          in: path

          required: true

          schema:

            type: string


      responses:

        "200":

          description: Analytics data



  /health:

    get:

      tags:

        - Health


      summary: Health check


      responses:

        "200":

          description: Service healthy



components:


  securitySchemes:


    bearerAuth:

      type: http

      scheme: bearer

      bearerFormat: JWT