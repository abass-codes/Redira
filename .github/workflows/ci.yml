name: CI

on:
  push:
  pull_request:


jobs:

  backend:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - run:
          go test ./...

      - run:
          go build ./...


  frontend:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend


    steps:

      - uses: actions/checkout@v4


      - uses: actions/setup-node@v4
        with:
          node-version: 20


      - run:
          npm install


      - run:
          npm run build