name: Deploy
on:

  push:

    branches:

      - main

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout

        uses: actions/checkout@v4

      - name: Setup Go

        uses: actions/setup-go@v5

        with:

          go-version: "1.26"

      - name: Test

        run:

          go test ./...

      - name: Build

        run:

          go build ./...